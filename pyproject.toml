[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f5-support-case-creation-api-tools"
version = "1.2.0"
description = "CLI tools for F5 BIG-IP QKView generation, retrieval, and MyF5/iHealth support case integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Greg Robinson", email = "g.robinson@f5.com" }
]
keywords = ["f5", "bigip", "ihealth", "myf5", "qkview", "support-case"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
]
dependencies = [
    "certifi>=2026.7.22",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
    "urllib3>=2.8.0",
]

[project.scripts]
qkviewmgr = "qkviewmgr.qkviewmgr:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pip-audit>=2.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: live network tests against F5 appliances",
    "unit: local unit tests without network requirements",
]



