name: "Release & Binary Attestation"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-binaries:
    name: Build Standalone Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: qkviewmgr-macos-arm64
            binary_src: dist/qkviewmgr
            binary_dest: qkviewmgr-macos-arm64
          - os: ubuntu-latest
            artifact_name: qkviewmgr-linux-x86_64
            binary_src: dist/qkviewmgr
            binary_dest: qkviewmgr-linux-x86_64
          - os: windows-latest
            artifact_name: qkviewmgr-windows-x64.exe
            binary_src: dist/qkviewmgr.exe
            binary_dest: qkviewmgr-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install --no-deps -r requirements.lock

      - name: Build standalone binary via PyInstaller
        run: |
          pyinstaller --clean --noconfirm qkviewmgr.spec

      - name: Stage named binary
        shell: bash
        run: |
          cp ${{ matrix.binary_src }} ${{ matrix.binary_dest }}

      - name: Test binary execution
        shell: bash
        run: |
          ./${{ matrix.binary_dest }} --help

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ${{ matrix.artifact_name }}.spdx.json

      - name: Attest Build Provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ matrix.binary_dest }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.binary_dest }}
            ${{ matrix.artifact_name }}.spdx.json

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all compiled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release with Attested Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
