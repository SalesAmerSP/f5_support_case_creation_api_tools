name: "Security Audit & Supply Chain Integrity"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  hash-verification:
    name: Verify Hash-Pinned Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with strict hash verification
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.lock

  vulnerability-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit with SARIF export
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.lock
          require-hashes: true
          format: sarif
          output: pip-audit-results.sarif

      - name: Upload pip-audit findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit
