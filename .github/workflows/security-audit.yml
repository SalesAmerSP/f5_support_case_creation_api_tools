name: "Security Audit & Supply Chain Integrity"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hash-verification:
    name: Verify Hash-Pinned Lockfile Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with strict hash verification
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.lock

  vulnerability-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run pip-audit vulnerability scanner
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.lock --require-hashes -f sarif -o pip-audit-results.sarif


      - name: Upload pip-audit findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('pip-audit-results.sarif') != ''
        with:
          sarif_file: pip-audit-results.sarif
          category: pip-audit

